<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vé Điện Tử - CineWave</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/main.css?v=2.2">
  <style>
    @media print {
      .navbar, .ticket-actions, .footer { display: none !important; }
      body { background-color: #fff !important; color: #000 !important; }
      .ticket-card { box-shadow: none !important; border: 1px solid #000 !important; margin: 0 auto; }
      .ticket-row span, .ticket-row strong { color: #000 !important; }
    }
  </style>
</head>
<body class="dark-theme">
  <!-- Navbar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <span class="logo-badge"><i class="fa-solid fa-film"></i></span>
        Cine<span>Wave</span>
      </a>
      <a href="index.html" class="btn btn-outline"><i class="fa-solid fa-house"></i> Về Trang Chủ</a>
    </div>
  </header>

  <main class="container ticket-view-container">
    <div class="ticket-card" id="ticket-card">
      <div class="ticket-header">
        <span class="badge success"><i class="fa-solid fa-circle-check"></i> Đã Thanh Toán Thành Công</span>
        <h2 style="margin-top:0.75rem;font-size:1.5rem;color:var(--text-primary);">
          <i class="fa-solid fa-ticket" style="color:var(--accent-red);margin-right:8px;"></i>VÉ XEM PHIM ĐIỆN TỬ
        </h2>
        <div class="ticket-code" id="ticket-code">Mã: Đang tải...</div>
      </div>

      <div class="ticket-body" id="ticket-details">
        <p class="placeholder-text">Đang tải thông tin chi tiết vé...</p>
      </div>

      <!-- QR Code Box -->
      <div class="ticket-qr" id="ticket-qr-container">
        <img id="qr-image" src="" alt="Mã QR Soát Vé" style="display:none;">
        <p><i class="fa-solid fa-qrcode" style="margin-right:5px;"></i>Quét mã QR tại cửa rạp để vào xem phim</p>
      </div>

      <div class="ticket-actions">
        <button class="btn btn-primary" onclick="window.print()" style="flex:1;">
          <i class="fa-solid fa-print"></i> In Vé / Lưu PDF
        </button>
        <a href="index.html" class="btn btn-outline" style="flex:1;">
          <i class="fa-solid fa-plus"></i> Đặt Thêm Vé
        </a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 CineWave. Đề tài 11 - Triển khai và Quản trị Hệ thống Phần mềm.</p>
    </div>
  </footer>

  <script src="js/common.js?v=2.2"></script>
  <script src="js/api.js?v=2.2"></script>
  <script src="js/ticket.js?v=2.2"></script>
</body>
</html>
